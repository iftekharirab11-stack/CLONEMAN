<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0d0d0d" stroke="#33ff33" stroke-width="2"/>
  
  <!-- Outer shield shape -->
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#33ff33;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22cc22;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield outline -->
  <path d="M 100 30 L 140 50 L 140 110 Q 100 150 100 150 Q 100 150 60 110 L 60 50 Z" 
        fill="url(#greenGradient)" stroke="#33ff33" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Inner darker shield -->
  <path d="M 100 35 L 135 52 L 135 110 Q 100 145 100 145 Q 100 145 65 110 L 65 52 Z" 
        fill="none" stroke="#33ff33" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Lock/Security symbol inside shield -->
  <g transform="translate(100, 85)">
    <!-- Lock body -->
    <rect x="-18" y="-5" width="36" height="28" rx="3" fill="none" stroke="#33ff33" stroke-width="2"/>
    
    <!-- Lock shackle (top arc) -->
    <path d="M -12 -5 Q -12 -20 0 -20 Q 12 -20 12 -5" fill="none" stroke="#33ff33" stroke-width="2"/>
    
    <!-- Keyhole -->
    <circle cx="0" cy="8" r="4" fill="none" stroke="#33ff33" stroke-width="1.5"/>
    <rect x="-1.5" y="12" width="3" height="8" fill="#33ff33"/>
  </g>
  
  <!-- Text: CLONEMAN -->
  <text x="100" y="170" font-family="Courier New, monospace" font-size="12" 
        font-weight="bold" fill="#33ff33" text-anchor="middle" letter-spacing="1">
    CLONEMAN
  </text>
  
  <!-- Decorative lines -->
  <line x1="50" y1="180" x2="150" y2="180" stroke="#33ff33" stroke-width="1" opacity="0.5"/>
  
  <!-- Version indicator -->
  <text x="100" y="192" font-family="Courier New, monospace" font-size="8" 
        fill="#33ff33" text-anchor="middle" opacity="0.7">
    KALI EDITION v1.0
  </text>
</svg>
